# 本地开发依赖（MySQL + Redis，对齐 TECH_STACK 选型）

services:
  mysql:
    image: mysql:8.0
    container_name: productcore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productcore
    ports:
      - "3307:3306"
    volumes:
      - productcore_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: productcore-redis
    ports:
      - "6380:6379"

volumes:
  productcore_mysql:
