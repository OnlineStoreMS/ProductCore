<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>商品采集设置</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; width: 380px; margin: 0; padding: 14px; color: #111827; }
    label { display: block; font-size: 12px; color: #4b5563; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #111827; }
    .ok { color: #047857; font-size: 12px; margin-top: 8px; }
    .wait { color: #b45309; font-size: 12px; margin-top: 8px; }
    p { font-size: 12px; color: #6b7280; line-height: 1.5; margin: 6px 0; }
  </style>
</head>
<body>
  <strong>上传到商品管理系统</strong>
  <p>在本 Chrome（采集用的这一套）打开商品系统登录一次后，Token 可留空。日常浏览器里的登录带不过来。</p>
  <label>API 地址</label>
  <input id="apiBase" placeholder="https://osms.zfcycle.com/apps/product" />
  <button type="button" class="secondary" id="login">在本浏览器打开并登录</button>
  <button type="button" class="secondary" id="check">检测本机登录</button>
  <label>Token（可选，已登录可留空）</label>
  <input id="token" placeholder="一般不用填" />
  <button id="save">保存</button>
  <div id="msg" class="wait"></div>
  <script src="popup.js"></script>
</body>
</html>
