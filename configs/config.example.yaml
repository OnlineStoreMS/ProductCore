server:
  port: 8090
  mode: debug

database:
  driver: postgres
  postgres_dsn: "host=127.0.0.1 user=postgres password=postgres dbname=productcore port=5432 sslmode=disable TimeZone=Asia/Shanghai"

redis:
  enabled: false
  addr: "127.0.0.1:6380"
  password: ""
  db: 0
  stream_key: "productcore:product:events"
  cache_ttl: 300

auth:
  enabled: true
  jwt_secret: "change-me-in-production-use-long-random-string"

storage:
  driver: minio                  # local | minio
  prefix: "uploads"
  local_path: "./data/uploads"   # driver: local 时生效
  public_base_url: "http://127.0.0.1:9100/productcore"
  minio:
    endpoint: "127.0.0.1:9100"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "productcore"
    use_ssl: false
    prefix: "uploads"
    public_read: true

cors:
  allow_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:5174"
    - "http://127.0.0.1:5174"
